name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Build wheel and sdist
        run: python -m build

      - name: Smoke-test packaged wheel
        shell: bash
        run: |
          python -m venv fresh_env
          source fresh_env/bin/activate
          python -m pip install dist/*.whl
          python - <<'PY'
          import json
          from importlib.resources import files

          from superqr_desktop.app import main
          from superqr_desktop.presentation.display import DisplayController
          from superqr_desktop.v7.profiles import PROFILES
          from superqr_desktop.lab.colorgrid8_core import (
              ColorGrid8Profile,
              build_symbol_frame,
          )

          contract = json.loads(
              files("superqr_desktop.contract")
              .joinpath("v7_production_qr_contract.json")
              .read_text(encoding="utf-8")
          )
          manifest = json.loads(
              files("superqr_desktop.lab")
              .joinpath("colorgrid8_manifest.json")
              .read_text(encoding="utf-8")
          )
          assert contract["status"] == "PRODUCTION_COMPATIBILITY_FROZEN"
          assert contract["optical"]["carrier"] == "ISO_QR_VERSION_40"
          assert len(PROFILES) == 6
          assert manifest["schema"] == "superqr.colorgrid8.lab.v1"
          profile = ColorGrid8Profile()
          frame = build_symbol_frame(profile, frame_index=0)
          assert frame.shape == (profile.rows, profile.cols)
          assert callable(main)
          assert DisplayController is not None
          print("Packaged production and ColorGrid8 artifacts: OK")
          PY
