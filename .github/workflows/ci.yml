name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build pytest

      - name: Run pytest
        run: |
          pytest

      - name: Build wheel and sdist
        run: |
          python -m build

      - name: Smoke test packaged contract loading
        run: |
          python -m venv fresh_env
          source fresh_env/bin/activate
          pip install dist/*.whl
          python -c "from superqr_desktop.contract.loader import load_contract; data, contract_hash = load_contract(); print(f'Successfully loaded packaged contract with hash: {contract_hash}')"
